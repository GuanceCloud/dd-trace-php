name: Build Release Packages

on:
  push:
    tags:
      - '*-gtrace'
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 'Release tag to publish. Defaults to VERSION.'
        required: false
      uploadToRelease:
        description: 'Upload generated assets to the GitHub release'
        required: false
        default: 'true'
      sourceRunId:
        description: 'Existing workflow run id containing build-* artifacts. When set, skips native builds.'
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-packages-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-platform:
    name: Build ${{ matrix.name }}
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.sourceRunId == ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-gnu
            runner: ubuntu-latest
            artifact_name: build-x86_64-gnu
            architecture: x86_64
            host_os: linux-gnu
            docker_platform: linux/amd64
            suffix: ''
          - name: aarch64-gnu
            runner: ubuntu-24.04-arm
            artifact_name: build-aarch64-gnu
            architecture: aarch64
            host_os: linux-gnu
            docker_platform: linux/arm64
            suffix: ''
          - name: x86_64-musl
            runner: ubuntu-latest
            artifact_name: build-x86_64-musl
            architecture: x86_64
            host_os: linux-musl
            docker_platform: linux/amd64
            suffix: -alpine
          - name: aarch64-musl
            runner: ubuntu-24.04-arm
            artifact_name: build-aarch64-musl
            architecture: aarch64
            host_os: linux-musl
            docker_platform: linux/arm64
            suffix: -alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build native assets
        run: ./.github/scripts/build-package-platform.sh "${{ matrix.architecture }}" "${{ matrix.host_os }}" "${{ matrix.docker_platform }}" "${{ matrix.suffix }}"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            extensions_*
            standalone_*
            appsec_*
            datadog-profiling/**
            libddtrace_php_*
            ddtrace_*.ldflags
            dd_library_loader-*.so

  package-release:
    name: Package release assets
    runs-on: ubuntu-24.04
    needs:
      - build-platform
    if: always() && !cancelled() && ((github.event_name == 'workflow_dispatch' && github.event.inputs.sourceRunId != '') || needs.build-platform.result == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: false
          path: build/release-artifacts
          run-id: ${{ github.event.inputs.sourceRunId || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            binutils-aarch64-linux-gnu \
            build-essential \
            pigz \
            rpm \
            ruby \
            ruby-dev
          sudo gem install --no-document fpm

      - name: Build package archives
        run: |
          set -euo pipefail

          rm -rf build/packages packages.tar.gz package_sha256sums

          cleanup_build_inputs() {
            rm -rf \
              extensions_* \
              standalone_* \
              appsec_* \
              datadog-profiling \
              libddtrace_php_* \
              ddtrace_*.ldflags \
              dd_library_loader-*.so
          }

          restore_artifact() {
            local artifact_name=$1

            cleanup_build_inputs
            cp -a "build/release-artifacts/${artifact_name}/." .
          }

          package_platform() {
            local artifact_name=$1
            local triplet=$2
            shift 2

            restore_artifact "$artifact_name"
            TRIPLET="$triplet" make -j 4 "$@"
            TRIPLET="$triplet" bash ./tooling/bin/generate-final-artifact.sh \
              "$(cat VERSION)" \
              "build/packages" \
              "${GITHUB_WORKSPACE}"
          }

          make build/packages
          make build/packages/datadog-setup.php

          package_platform build-x86_64-musl x86_64-alpine-linux-musl .apk.x86_64
          package_platform build-aarch64-musl aarch64-alpine-linux-musl .apk.aarch64
          package_platform build-x86_64-gnu x86_64-unknown-linux-gnu .rpm.x86_64 .deb.x86_64 .tar.gz.x86_64
          package_platform build-aarch64-gnu aarch64-unknown-linux-gnu .rpm.arm64 .deb.arm64 .tar.gz.aarch64

          cleanup_build_inputs
          cp -a build/release-artifacts/build-x86_64-musl/. .
          cp -a build/release-artifacts/build-aarch64-musl/. .
          cp -a build/release-artifacts/build-x86_64-gnu/. .
          cp -a build/release-artifacts/build-aarch64-gnu/. .
          make ssi_packages

          tar --use-compress-program=pigz --exclude='dd-library-php-ssi-*' -cf packages.tar.gz build/packages --owner=0 --group=0
          (cd build/packages && find . -type f -exec sha256sum {} + > ../../package_sha256sums)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          if-no-files-found: error
          path: |
            build/packages/**
            packages.tar.gz
            package_sha256sums

      - name: Resolve release tag
        id: release
        run: |
          if [ -n "${{ github.event.inputs.releaseTag || '' }}" ]; then
            tag='${{ github.event.inputs.releaseTag }}'
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(cat VERSION)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        if: github.event_name == 'push' || github.event.inputs.uploadToRelease != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "Automated package build for $RELEASE_TAG"
          fi

      - name: Upload assets to GitHub release
        if: github.event_name == 'push' || github.event.inputs.uploadToRelease != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" build/packages/* --clobber --repo "$REPOSITORY"
