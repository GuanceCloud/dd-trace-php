name: Build Release Packages

on:
  push:
    tags:
      - '*-gtrace'
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 'Release tag to publish. Defaults to VERSION.'
        required: false
      uploadToRelease:
        description: 'Upload generated assets to the GitHub release'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: release-packages-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build-platform:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-gnu
            artifact_name: build-x86_64-gnu
            architecture: x86_64
            host_os: linux-gnu
            docker_platform: linux/amd64
            suffix: ''
          - name: aarch64-gnu
            artifact_name: build-aarch64-gnu
            architecture: aarch64
            host_os: linux-gnu
            docker_platform: linux/arm64
            suffix: ''
          - name: x86_64-musl
            artifact_name: build-x86_64-musl
            architecture: x86_64
            host_os: linux-musl
            docker_platform: linux/amd64
            suffix: -alpine
          - name: aarch64-musl
            artifact_name: build-aarch64-musl
            architecture: aarch64
            host_os: linux-musl
            docker_platform: linux/arm64
            suffix: -alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU for arm64
        if: matrix.docker_platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build native assets
        run: ./.github/scripts/build-package-platform.sh "${{ matrix.architecture }}" "${{ matrix.host_os }}" "${{ matrix.docker_platform }}" "${{ matrix.suffix }}"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            extensions_*
            standalone_*
            appsec_*
            datadog-profiling/**
            libddtrace_php_*
            ddtrace_*.ldflags
            dd_library_loader-*.so

  package-release:
    name: Package release assets
    runs-on: ubuntu-latest
    needs:
      - build-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: ${{ github.workspace }}

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            binutils-aarch64-linux-gnu \
            build-essential \
            pigz \
            rpm \
            ruby \
            ruby-dev
          sudo gem install --no-document fpm

      - name: Build package archives
        run: |
          make packages
          make calculate_package_sha256_sums

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          if-no-files-found: error
          path: |
            build/packages/**
            packages.tar.gz
            package_sha256sums

      - name: Resolve release tag
        id: release
        run: |
          if [ -n "${{ github.event.inputs.releaseTag || '' }}" ]; then
            tag='${{ github.event.inputs.releaseTag }}'
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag='${GITHUB_REF_NAME}'
          else
            tag="$(cat VERSION)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        if: github.event_name == 'push' || github.event.inputs.uploadToRelease != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "Automated package build for $RELEASE_TAG"
          fi

      - name: Upload assets to GitHub release
        if: github.event_name == 'push' || github.event.inputs.uploadToRelease != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" build/packages/* --clobber --repo "$REPOSITORY"
